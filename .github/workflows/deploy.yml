# Place at: .github/workflows/deploy.yml in the PRIVATE source repo.
# Builds the website from private source and publishes ONLY the built files
# to the public repo's /docs folder (served by GitHub Pages).
name: Build site and publish to public repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "site-publish"
  cancel-in-progress: true

env:
  PUBLIC_REPO: ABritishGamedev/inertis-studio

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: node ./node_modules/vite/bin/vite.js build

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-site

      - name: Publish built site to public repo
        run: |
          rm -rf public-site/docs
          mkdir -p public-site/docs
          cp -r dist/. public-site/docs/
          touch public-site/docs/.nojekyll
          cd public-site
          git config user.name "inertis-bot"
          git config user.email "inertis-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "Deploy site build ${GITHUB_SHA::7}"
            git push
          fi
